name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; pushes to deploy branches always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgres://kefken:kefken@localhost:5432/kefken
  PAYLOAD_SECRET: ci-secret-not-used-anywhere-else-000000000000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: kefken-media
  S3_LEADS_BUCKET: kefken-leads
  S3_ACCESS_KEY_ID: ciaccess
  S3_SECRET_ACCESS_KEY: cisecret123
  S3_FORCE_PATH_STYLE: 'true'
  MEDIA_PUBLIC_URL: http://localhost:9000/kefken-media
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    # Self-hosted runner on the Dokploy server (docs/RUNBOOK.md): GitHub-hosted minutes are unavailable for this account.
    runs-on: [self-hosted, kefken]
    # The self-hosted runner has the host Docker socket: never run code from forks on it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kefken
          POSTGRES_PASSWORD: kefken
          POSTGRES_DB: kefken
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U kefken" --health-interval 5s --health-retries 20
      s3:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ciaccess
          RUSTFS_SECRET_KEY: cisecret123
        ports: ['9000']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Point env at this job's service ports
        run: |
          PG=${{ job.services.postgres.ports['5432'] }}; S3=${{ job.services.s3.ports['9000'] }}
          echo "DATABASE_URL=postgres://kefken:kefken@localhost:$PG/kefken" >> "$GITHUB_ENV"
          echo "S3_ENDPOINT=http://localhost:$S3" >> "$GITHUB_ENV"
          echo "MEDIA_PUBLIC_URL=http://localhost:$S3/kefken-media" >> "$GITHUB_ENV"
          echo "E2E_PORT=$(node -e "const s=require('net').createServer().listen(0,()=>{console.log(s.address().port);s.close()})")" >> "$GITHUB_ENV"

      - name: Create S3 buckets
        run: |
          aws() { docker run --rm --network host -e AWS_ACCESS_KEY_ID=ciaccess -e AWS_SECRET_ACCESS_KEY=cisecret123 -e AWS_DEFAULT_REGION=us-east-1 amazon/aws-cli:2.38.0 --endpoint-url=http://localhost:${{ job.services.s3.ports['9000'] }} "$@"; }
          for i in $(seq 1 30); do aws s3 ls >/dev/null 2>&1 && break; sleep 1; done
          aws s3 mb s3://kefken-media
          aws s3 mb s3://kefken-leads
          aws s3api put-bucket-policy --bucket kefken-media --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::kefken-media/*"]}]}'

      - run: bun run typecheck
      - run: bun run lint
      - name: Generated files are committed
        run: bun run check:generated
      - name: Unit + integration tests
        run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: E2E (production build)
        env:
          E2E_START_COMMAND: bun run start -- -p ${{ env.E2E_PORT }}
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    # Builds the image on the server, then Dokploy redeploys the compose; only after checks pass on a deploy branch.
    needs: check
    # Production deploys stay off until the owner sets the repo variable PRODUCTION_DEPLOY_APPROVED=true (launch, #53).
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/development' || (github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_APPROVED == 'true'))
    runs-on: [self-hosted, kefken]
    concurrency: deploy-${{ github.ref }}
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    env:
      SITE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      # Built straight into the server's Docker (the runner uses the host socket); Dokploy runs this image.
      - name: Build app image
        run: |
          docker build -t "kefkenahsap-app:$SITE_ENV" \
            --build-arg SITE_ENV="$SITE_ENV" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            --build-arg NEXT_PUBLIC_GA_ID="${{ vars.NEXT_PUBLIC_GA_ID }}" \
            --build-arg NEXT_PUBLIC_UMAMI_WEBSITE_ID="${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}" \
            --build-arg NEXT_PUBLIC_UMAMI_SRC="${{ vars.NEXT_PUBLIC_UMAMI_SRC }}" \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
            .
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$COMPOSE_ID" ]; then
            echo "::warning::Dokploy deploy is not configured for this environment"
            [ "$GITHUB_REF" = refs/heads/main ] && exit 1 || exit 0
          fi
          curl -fsS -o /dev/null -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"$COMPOSE_ID\"}"
