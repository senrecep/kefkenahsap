name: CI

on:
  pull_request:
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://kefken:kefken@localhost:5432/kefken
  PAYLOAD_SECRET: ci-secret-not-used-anywhere-else-000000000000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: kefken-media
  S3_LEADS_BUCKET: kefken-leads
  S3_ACCESS_KEY_ID: ciaccess
  S3_SECRET_ACCESS_KEY: cisecret123
  S3_FORCE_PATH_STYLE: 'true'
  MEDIA_PUBLIC_URL: http://localhost:9000/kefken-media
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kefken
          POSTGRES_PASSWORD: kefken
          POSTGRES_DB: kefken
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kefken" --health-interval 5s --health-retries 20
      s3:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ciaccess
          RUSTFS_SECRET_KEY: cisecret123
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      - name: Create S3 buckets
        env:
          AWS_ACCESS_KEY_ID: ciaccess
          AWS_SECRET_ACCESS_KEY: cisecret123
          AWS_DEFAULT_REGION: us-east-1
        run: |
          E=--endpoint-url=http://localhost:9000
          for i in $(seq 1 30); do aws $E s3 ls >/dev/null 2>&1 && break; sleep 1; done
          aws $E s3 mb s3://kefken-media
          aws $E s3 mb s3://kefken-leads
          aws $E s3api put-bucket-policy --bucket kefken-media --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::kefken-media/*"]}]}'

      - run: bun run typecheck
      - run: bun run lint
      - name: Generated files are committed
        run: bun run check:generated
      - name: Unit + integration tests
        run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: E2E (production build)
        env:
          E2E_START_COMMAND: bun run start
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    # Dokploy builds and runs docker-compose.dokploy.yml; only after checks pass on a deploy branch.
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$COMPOSE_ID" ]; then echo "Dokploy not configured for this environment; skipping"; exit 0; fi
          curl -fsS -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"$COMPOSE_ID\"}"
