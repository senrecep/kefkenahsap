# Deploy stack for Dokploy (development and production environments).
# Domains/TLS are configured in the Dokploy UI (Traefik on dokploy-network).
# Optional services: set COMPOSE_PROFILES=observability in the Dokploy environment to run GlitchTip.
# Deploy each environment with Dokploy "isolated deployment" so service names never collide on dokploy-network.
name: kefkenahsap

services:
  app:
    # Built on the server by CI (docker build -t kefkenahsap-app:<SITE_ENV> .); see docs/RUNBOOK.md.
    image: kefkenahsap-app:${SITE_ENV:?}
    pull_policy: never
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kefken:${POSTGRES_PASSWORD:?}@kefken-postgres:5432/kefken
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:?}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DEBUG_ERROR_TOKEN: ${DEBUG_ERROR_TOKEN:-} # leave unset in production (the route also requires SITE_ENV=development)
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
      SITE_ENV: ${SITE_ENV:?}
      LEAD_PHOTOS_DIR: /app/data/lead-photos
      MEDIA_ORIGINALS_DIR: /app/data/media-originals
      SITE_BASIC_AUTH: ${SITE_BASIC_AUTH:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      # Lead photos are personal data: private disk volume, never the CDN bucket (archived nightly by kefken-backup).
      - lead-photos:/app/data/lead-photos
      # Clean originals of watermarked admin uploads (#169): private disk volume, never served; kept to re-apply or
      # remove the mark. Archived nightly by kefken-backup (a private R2 bucket needs the owner's new token, #51).
      - media-originals:/app/data/media-originals
    depends_on:
      kefken-postgres:
        condition: service_healthy
    networks: [default, dokploy-network]

  # Unique name: app/umami also sit on the shared dokploy-network, where a plain "postgres" resolves to other stacks.
  kefken-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kefken
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: kefken
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U kefken -d kefken'] # TCP: not ready during the init-time server
      interval: 5s
      retries: 20

  # Creates the umami DB, and (when GLITCHTIP_DB_PASSWORD is set) a non-superuser role "glitchtip" owning only the
  # glitchtip DB. Idempotent, runs on every deploy; no bind-mounted files.
  db-init:
    image: postgres:17-alpine
    restart: 'no'
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      GLITCHTIP_DB_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        q() { psql -h kefken-postgres -U kefken -d kefken -v ON_ERROR_STOP=1 "$$@"; }
        q -tc "SELECT 1 FROM pg_database WHERE datname='umami'" | grep -q 1 || q -c "CREATE DATABASE umami"
        if [ -n "$$GLITCHTIP_DB_PASSWORD" ]; then
          q -tc "SELECT 1 FROM pg_roles WHERE rolname='glitchtip'" | grep -q 1 || q -c "CREATE ROLE glitchtip LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE"
          echo "ALTER ROLE glitchtip PASSWORD :'pw'" | q -v pw="$$GLITCHTIP_DB_PASSWORD"
          q -tc "SELECT 1 FROM pg_database WHERE datname='glitchtip'" | grep -q 1 || q -c "CREATE DATABASE glitchtip OWNER glitchtip"
          q -c "REVOKE CONNECT ON DATABASE kefken, umami FROM PUBLIC"
        fi
    depends_on:
      kefken-postgres:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:3.0.3
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kefken:${POSTGRES_PASSWORD:?}@kefken-postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [default, dokploy-network]

  glitchtip-web:
    image: glitchtip/glitchtip:6
    profiles: [observability]
    restart: unless-stopped
    environment: &glitchtip-env
      # Own role, not the kefken superuser (db-init). GLITCHTIP_DB_PASSWORD: URL-safe characters only.
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-}@kefken-postgres:5432/glitchtip
      VALKEY_URL: redis://kefken-valkey:6379/0
      REDIS_URL: redis://kefken-valkey:6379/0 # older GlitchTip releases
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-}
      ENABLE_USER_REGISTRATION: 'false'
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      kefken-valkey:
        condition: service_started
    networks: [default, dokploy-network]

  glitchtip-worker:
    image: glitchtip/glitchtip:6
    profiles: [observability]
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip-env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully

  # GlitchTip starts even with an empty SECRET_KEY, so the migrate step refuses one shorter than 32 chars (web and worker
  # wait for it to succeed).
  glitchtip-migrate:
    image: glitchtip/glitchtip:6
    profiles: [observability]
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        [ $${#SECRET_KEY} -ge 32 ] || { echo 'GLITCHTIP_SECRET_KEY must be set (>= 32 random chars)'; exit 1; }
        case "$$DATABASE_URL" in *//glitchtip:@*) echo 'GLITCHTIP_DB_PASSWORD must be set'; exit 1 ;; esac
        exec ./bin/run-migrate.sh
    environment: *glitchtip-env
    depends_on:
      db-init:
        condition: service_completed_successfully

  kefken-valkey:
    image: valkey/valkey:8-alpine
    profiles: [observability]
    restart: unless-stopped

  # Nightly pg_dump of the kefken DB plus tar archives of the private file volumes (lead photos, clean media originals)
  # to a host directory (keeps 14 each), then optionally a copy to a PRIVATE R2 bucket.
  # Runs at BACKUP_AT (HHMM, UTC). Run now: docker exec <container> touch /backups/.run-now (picked up within a minute).
  kefken-backup:
    image: kefken-backup:17-rclone1.75.1
    build:
      # pg_dump + a pinned, static rclone binary (built on the server at deploy; no runtime package install).
      dockerfile_inline: |
        FROM rclone/rclone:1.75.1 AS rclone
        FROM postgres:17-alpine
        COPY --from=rclone /usr/local/bin/rclone /usr/local/bin/rclone
    profiles: [backup]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_AT: ${BACKUP_AT:-0100}
      SITE_ENV: ${SITE_ENV:?}
      # Only the private kefkenahsap-backups bucket is accepted: dumps hold personal data (leads); media buckets are public.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      # A dedicated R2 token scoped to that bucket only, never the app's media key.
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${S3_ENDPOINT:?}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - /var/lib/kefken-backups/${SITE_ENV:?}:/backups
      - lead-photos:/data/lead-photos:ro
      - media-originals:/data/media-originals:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        umask 077; chmod 700 /backups; rm -f /backups/*.part
        log() { echo "$$(date -u +%FT%TZ) backup: $$*"; }
        upload() {
          case "$$BACKUP_S3_BUCKET" in
            '') log "R2 upload skipped: BACKUP_S3_BUCKET not set"; return ;;
            kefkenahsap-backups) ;;
            *) log "R2 upload refused: '$$BACKUP_S3_BUCKET' is not the private kefkenahsap-backups bucket"; return ;;
          esac
          [ -n "$$BACKUP_S3_ACCESS_KEY_ID" ] || { log "R2 upload skipped: BACKUP_S3_ACCESS_KEY_ID not set (dedicated backup token pending); local copy kept"; return; }
          if out=$$(rclone copyto "$$1" "r2:$$BACKUP_S3_BUCKET/$$SITE_ENV/$${1##*/}" --s3-no-check-bucket 2>&1); then
            log "uploaded to r2:$$BACKUP_S3_BUCKET/$$SITE_ENV/$${1##*/}"
          elif echo "$$out" | grep -qE 'AccessDenied|403'; then
            log "R2 upload skipped: access denied to $$BACKUP_S3_BUCKET (check the backup token's bucket scope); local copy kept"
          else
            log "R2 upload FAILED: $$(echo "$$out" | tail -n 1)"
          fi
        }
        run() {
          f=/backups/kefken-$$(date -u +%Y%m%d-%H%M%S).dump
          # Temp name + readable-archive check first: a failed or corrupt dump never replaces or rotates out a good one.
          if pg_dump -h kefken-postgres -U kefken -d kefken -Fc -f "$$f.part" && pg_restore -l "$$f.part" >/dev/null && mv "$$f.part" "$$f"; then
            log "wrote $$f ($$(du -h "$$f" | cut -f1))"
            ls -1t /backups/kefken-*.dump | tail -n +15 | xargs -r rm -f
            upload "$$f"
          else
            rm -f "$$f.part"; log "pg_dump FAILED"
          fi
          for v in lead-photos media-originals; do
            a=/backups/$$v-$$(date -u +%Y%m%d-%H%M%S).tar.gz
            # Same temp-name rule as the dump: only a complete, readable archive replaces or rotates out a good one.
            if tar -czf "$$a.part" -C /data "$$v" && tar -tzf "$$a.part" >/dev/null && mv "$$a.part" "$$a"; then
              log "wrote $$a ($$(du -h "$$a" | cut -f1))"
              ls -1t /backups/$$v-*.tar.gz | tail -n +15 | xargs -r rm -f
              upload "$$a"
            else
              rm -f "$$a.part"; log "$$v archive FAILED"
            fi
          done
        }
        log "scheduled daily at $$BACKUP_AT UTC"
        while :; do
          if [ "$$(date -u +%H%M)" = "$$BACKUP_AT" ] || [ -e /backups/.run-now ]; then
            rm -f /backups/.run-now; run; sleep 60
          fi
          sleep 20
        done
    depends_on:
      kefken-postgres:
        condition: service_healthy

volumes:
  pgdata:
  lead-photos:
  media-originals:

networks:
  dokploy-network:
    external: true
