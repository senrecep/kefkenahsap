<!doctype html>
<!-- Open Graph card template (1200×630), screenshotted per locale by scripts/og/generate.ts into public/og-<locale>.png.
     The generator sets lang/dir and the tagline from messages/<locale>/common.json (Site.tagline); nothing here is copy.
     Fonts are the site's own files (src/app/fonts), split by unicode-range exactly as the site loads them. -->
<html lang="tr" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>OG card</title>
    <style>
      /* One family per role, each script its own file (disjoint ranges, as in src/app/fonts/README.md). Noto Sans Arabic
         stands in for both roles in Arabic, as on the site. */
      @font-face { font-family: 'Montserrat'; src: url('../../src/app/fonts/Montserrat.woff2') format('woff2'); font-weight: 600; unicode-range: U+0020-007E, U+00A0-017F, U+1E9E, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: 'Montserrat'; src: url('../../src/app/fonts/Montserrat-cyrillic.woff2') format('woff2'); font-weight: 600; unicode-range: U+0400-045F, U+0490-0491, U+2116; }
      @font-face { font-family: 'Montserrat'; src: url('../../src/app/fonts/NotoSansArabic.woff2') format('woff2'); font-weight: 400 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+2066-2069; }
      @font-face { font-family: 'Source Sans 3'; src: url('../../src/app/fonts/SourceSans3.woff2') format('woff2'); font-weight: 400 600; unicode-range: U+0020-007E, U+00A0-017F, U+1E9E, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+20BA, U+2122, U+2190-2193, U+2212; }
      @font-face { font-family: 'Source Sans 3'; src: url('../../src/app/fonts/SourceSans3-cyrillic.woff2') format('woff2'); font-weight: 400 600; unicode-range: U+0400-045F, U+0490-0491, U+2116; }
      @font-face { font-family: 'Source Sans 3'; src: url('../../src/app/fonts/NotoSansArabic.woff2') format('woff2'); font-weight: 400 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+2066-2069; }

      :root {
        /* DESIGN.md tokens */
        --paper: #fbfaf7;
        --ink: #1d1f1c;
        --ink-soft: #5c5f58;
        --action: #0b7a3e;
        --line: #e4e1da;
        --display: 'Montserrat', sans-serif;
        --body: 'Source Sans 3', sans-serif;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        display: grid;
        grid-template-rows: 372px 1fr;
      }
      /* The work is the proof: one real job photo, full bleed, no scrim and no text on it. */
      .photo { width: 100%; height: 100%; object-fit: cover; object-position: 50% 64%; display: block; }
      /* Paper band: the logo keeps its own colours (dark ink + greens), so it never sits on the photo. */
      .band {
        border-block-start: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 0 60px;
        text-align: center;
      }
      .logo { height: 92px; width: auto; display: block; }
      .tagline {
        font-family: var(--body);
        font-weight: 600;
        font-size: 27px;
        line-height: 1.25;
        max-width: 1080px;
        text-wrap: balance;
      }
      .domain {
        font-family: var(--display);
        font-weight: 600;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--action);
      }
      :lang(ar) .tagline { font-size: 28px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <img class="photo" src="photo.jpg" alt="" />
    <div class="band">
      <img class="logo" src="../../public/brand/logo.png" alt="Kefken Ahşap Dekorasyon" />
      <p class="tagline" id="tagline">Ahşap deck, pergola ve dış mekân ahşap işleri — İstanbul ve Türkiye geneli</p>
      <p class="domain" dir="ltr">kefkenahsap.com</p>
    </div>
  </body>
</html>
